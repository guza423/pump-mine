<title>PERFORMANCE Uygulaması</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>


*, *::before, *::after { box-sizing: border-box; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.neuro { color: var(--neuro); }
.fire { color: var(--fire); }


/* Header */

/* Axon progress */
.axon { position: relative; margin-block: 6px 26px; }
.axon-track { position: absolute; left: 0; right: 0; top: 0; height: 36px; pointer-events: none; }
.myelin {
  position: absolute; top: 13px; height: 10px; border-radius: 999px;
  background: var(--raised); border: 1px solid var(--line-strong);
  transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
}
.myelin.lit {
  background: linear-gradient(90deg, rgba(57, 213, 255, 0.35), rgba(57, 213, 255, 0.18));
  border-color: rgba(57, 213, 255, 0.55); box-shadow: 0 0 14px rgba(57, 213, 255, 0.35);
}
.axon-pulse {
  position: absolute; top: 9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 22%, var(--neuro) 45%, rgba(57, 213, 255, 0) 72%);
  box-shadow: 0 0 22px 6px rgba(57, 213, 255, 0.45);
  transition: left 0.7s cubic-bezier(0.65, 0, 0.25, 1);
  z-index: 2;
}
.axon-nodes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; z-index: 1; }
.node {
  appearance: none; background: none; border: 0; color: var(--muted); cursor: pointer; width: 100%;
  display: grid; justify-items: center; gap: 8px; padding: 4px 2px 6px; font: inherit; border-radius: 10px;
}
.node-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel); border: 1.5px solid var(--line-strong);
  font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--faint);
  transition: border-color 0.3s, color 0.3s, box-shadow 0.3s, background 0.3s;
}
.node-label { font-size: 12px; letter-spacing: 0.04em; transition: color 0.3s; }
.node:hover .node-dot { border-color: var(--neuro); color: var(--neuro); }
.node.done .node-dot { border-color: rgba(57, 213, 255, 0.6); color: var(--neuro); background: rgba(57, 213, 255, 0.08); }
.node.current .node-dot { border-color: var(--neuro); color: transparent; background: transparent; box-shadow: 0 0 0 4px rgba(57, 213, 255, 0.12); }
.node.current .node-label { color: var(--text); font-weight: 600; }
.node:focus-visible { outline: 2px solid var(--neuro); outline-offset: 2px; }

/* Stage */
.stage-wrap { animation: stage-in 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes stage-in { from { opacity: 0.35; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stage { display: grid; gap: 18px; }
.stage-head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neuro); }
h2 {
  margin: 0; font-family: var(--f-display); font-stretch: 82%; font-weight: 700;
  font-size: clamp(24px, 3.6vw, 36px); line-height: 1.05; text-wrap: balance;
}
.lede { margin: 0; color: var(--muted); max-width: 64ch; }
.stage-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }


.lab {
  min-width: 0; display: grid; gap: 16px; padding: 18px;
  background:
    linear-gradient(rgba(57, 213, 255, 0.035) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(57, 213, 255, 0.035) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(180deg, var(--panel), var(--deep));
  border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.03);
}


/* Notes rail */
.notes { display: grid; gap: 12px; min-width: 0; }
.note { padding: 14px 16px; border-radius: 12px; }
.note p { margin: 0; font-size: 14px; line-height: 1.6; }
.note-label {
  display: flex; align-items: center; gap: 7px; margin-bottom: 7px;
  font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
}
.note-what { background: var(--raised); border: 1px solid var(--line); }
.note-what .note-label { color: var(--neuro); }
.note-tip { background: linear-gradient(160deg, rgba(255, 138, 61, 0.12), rgba(255, 138, 61, 0.03)); border: 1px solid rgba(255, 138, 61, 0.35); }
.note-tip .note-label { color: var(--fire); }
.note-caveat { border: 1px dashed var(--line-strong); }
.note-caveat .note-label { color: var(--muted); }
.note-caveat p { color: var(--muted); font-size: 13.5px; }

/* Buttons */
.btn {
  appearance: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 600 14px/1 var(--f-body); letter-spacing: 0.01em; padding: 11px 16px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--raised); color: var(--text);
  transition: transform 0.12s, box-shadow 0.2s, background 0.2s, border-color 0.2s, opacity 0.2s;
}
.btn:hover:not(:disabled) { border-color: var(--neuro); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--neuro-hi); outline-offset: 2px; }
.btn.primary { background: rgba(57, 213, 255, 0.12); border-color: var(--neuro); color: var(--neuro-hi); box-shadow: 0 0 22px -4px rgba(57, 213, 255, 0.45); }
.btn.primary:hover:not(:disabled) { background: rgba(57, 213, 255, 0.2); }
.btn.fire { background: rgba(255, 138, 61, 0.14); border-color: var(--fire); color: #ffd7bd; box-shadow: 0 0 22px -4px rgba(255, 138, 61, 0.5); }
.btn.fire:hover:not(:disabled) { background: rgba(255, 138, 61, 0.24); border-color: var(--amber); }
.btn.ghost { background: transparent; }

.lab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.readout-chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--deep); border: 1px solid var(--line); }
.rc-k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-family: var(--f-mono); }
.rc-v { color: var(--neuro); font-size: 15px; font-weight: 600; min-width: 58px; }
.status-line { color: var(--muted); font-size: 14px; min-width: 0; }
.status-line.live { color: var(--text); }
.set-info { margin-left: auto; color: var(--muted); font-size: 12.5px; }


/* Stage 1 diagram */
.diagram { overflow-x: auto; border-radius: 12px; background: rgba(4, 6, 12, 0.55); border: 1px solid var(--line); }
.diagram svg { display: block; width: 100%; min-width: 300px; height: auto; }
.brain { fill: rgba(57, 213, 255, 0.04); stroke: rgba(150, 180, 230, 0.45); stroke-width: 1.6; }
.gyri path { fill: none; stroke: rgba(150, 180, 230, 0.22); stroke-width: 1.3; stroke-linecap: round; }
.motor-strip { fill: none; stroke: rgba(57, 213, 255, 0.55); stroke-width: 6; stroke-linecap: round; transition: stroke 0.3s, stroke-width 0.3s; }
.motor-strip.on { stroke: var(--neuro-hi); stroke-width: 8; }
.cord { fill: #0d1730; stroke: rgba(150, 180, 230, 0.35); stroke-width: 1.2; }
.vertebra { fill: none; stroke: rgba(150, 180, 230, 0.12); stroke-width: 1; }
.path-base { fill: none; stroke: rgba(57, 213, 255, 0.16); stroke-width: 3; stroke-linecap: round; }
.path-lit { fill: none; stroke: var(--neuro); stroke-width: 3; stroke-linecap: round; transition: opacity 0.6s; }
.path-trail { fill: none; stroke: var(--neuro-hi); stroke-width: 4.5; stroke-linecap: round; }
.soma path { stroke: rgba(150, 180, 230, 0.5); stroke-width: 1.4; fill: none; stroke-linecap: round; }
.soma circle { fill: #11203f; stroke: rgba(57, 213, 255, 0.6); stroke-width: 1.6; transition: fill 0.2s; }
.soma.on circle { fill: var(--neuro); stroke: var(--neuro-hi); }
.tendon { stroke: #33415f; stroke-width: 9; stroke-linecap: round; }
.belly { stroke: rgba(255, 138, 61, 0.55); stroke-width: 1.6; }
.belly-glow { fill: var(--fire); }
.fiber { stroke: rgba(255, 138, 61, 0.22); stroke-width: 7; stroke-linecap: round; }
.fiber-hot { stroke: var(--fire); stroke-width: 7; stroke-linecap: round; }
.ca-dot { fill: var(--neuro-hi); transition: opacity 0.4s; }
.nmj-core { fill: #11203f; stroke: rgba(57, 213, 255, 0.7); stroke-width: 1.5; }
.nmj-core.on { fill: var(--neuro); }
.ach { fill: var(--neuro-hi); }
.spark-halo { fill: rgba(57, 213, 255, 0.35); }
.spark-core { fill: #fff; }
.marker circle { fill: var(--deep); stroke: var(--line-strong); stroke-width: 1.5; transition: stroke 0.25s, fill 0.25s; }
.marker text { font-family: var(--f-mono); font-size: 13px; font-weight: 600; fill: var(--faint); transition: fill 0.25s; }
.marker.passed circle { stroke: rgba(57, 213, 255, 0.6); }
.marker.passed text { fill: var(--neuro); }
.marker.active circle { stroke: var(--neuro-hi); fill: rgba(57, 213, 255, 0.22); }
.marker.active text { fill: #fff; }

.stations { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.stations li {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; transition: background 0.25s, border-color 0.25s;
}
.st-num {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--line-strong); font-size: 11px; color: var(--faint); transition: all 0.25s;
}
.st-body { display: grid; gap: 1px; min-width: 0; }
.st-body strong { font-size: 14px; font-weight: 600; }
.st-body span { font-size: 13px; color: var(--muted); }
.stations li.passed .st-num { border-color: rgba(57, 213, 255, 0.6); color: var(--neuro); }
.stations li.active { background: rgba(57, 213, 255, 0.07); border-color: rgba(57, 213, 255, 0.3); }
.stations li.active .st-num { border-color: var(--neuro-hi); color: #fff; background: rgba(57, 213, 255, 0.25); box-shadow: 0 0 12px rgba(57, 213, 255, 0.5); }
.caption { margin: 0; font-size: 12.5px; color: var(--faint); }

/* Ranges */
.field { display: grid; gap: 6px; min-width: 0; }
.field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.field-top label { font-size: 13.5px; color: var(--muted); }
.field-val { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; }
.field-hint { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); text-align: right; }
.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; }
.rng::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--track, var(--line-strong)); }
.rng::-moz-range-track { height: 6px; border-radius: 999px; background: var(--track, var(--line-strong)); }
.rng::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%;
  background: var(--neuro); border: 2.5px solid #e9fbff; box-shadow: 0 0 0 5px rgba(57, 213, 255, 0.14), 0 0 16px rgba(57, 213, 255, 0.8);
}
.rng::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--neuro); border: 2.5px solid #e9fbff; box-shadow: 0 0 0 5px rgba(57, 213, 255, 0.14), 0 0 16px rgba(57, 213, 255, 0.8); }
.rng-fire::-webkit-slider-thumb { background: var(--fire); border-color: #fff1e6; box-shadow: 0 0 0 5px rgba(255, 138, 61, 0.16), 0 0 16px rgba(255, 138, 61, 0.85); }
.rng-fire::-moz-range-thumb { background: var(--fire); border-color: #fff1e6; box-shadow: 0 0 0 5px rgba(255, 138, 61, 0.16), 0 0 16px rgba(255, 138, 61, 0.85); }
.rng:focus-visible { outline: 2px solid var(--neuro-hi); outline-offset: 4px; border-radius: 6px; }

/* Switch */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--muted); }
.switch {
  appearance: none; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 12px 4px 4px;
  border-radius: 999px; border: 1px solid var(--line-strong); background: var(--deep); color: var(--muted); font: 600 12.5px var(--f-mono);
  transition: border-color 0.2s, background 0.2s;
}
.switch .knob { width: 22px; height: 22px; border-radius: 50%; background: var(--line-strong); transition: transform 0.25s, background 0.25s, box-shadow 0.25s; }
.switch.on { border-color: var(--neuro); background: rgba(57, 213, 255, 0.1); color: var(--neuro-hi); }
.switch.on .knob { background: var(--neuro); box-shadow: 0 0 12px var(--neuro); }
.switch:focus-visible { outline: 2px solid var(--neuro-hi); outline-offset: 2px; }
.switch-txt { min-width: 44px; text-align: left; }

/* Readouts */
.big-readout { display: grid; gap: 2px; }
.big-num { font-size: clamp(34px, 6vw, 52px); font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.big-num small { font-size: 0.45em; color: var(--muted); font-weight: 400; margin-left: 2px; }
.big-k { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--f-mono); }

/* Stage 2 */
.recruit-top { display: flex; flex-wrap: wrap; gap: 14px 40px; }
.load-ctl { display: grid; gap: 8px; }
.zones { display: flex; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--faint); margin-top: -4px; }
.zones span { border-left: 1px solid var(--line-strong); padding-left: 5px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; cursor: pointer; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: transparent; color: var(--muted); font: 600 12.5px var(--f-mono);
}
.chip:hover { color: var(--text); border-color: var(--fire); }
.chip.on { color: #ffd7bd; border-color: var(--fire); background: rgba(255, 138, 61, 0.12); }
.chip:focus-visible { outline: 2px solid var(--neuro-hi); outline-offset: 2px; }
.mu-groups { display: grid; gap: 12px; }
.mu-group { display: grid; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(4, 6, 12, 0.5); border: 1px solid var(--line); }
.mu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mu-head > div { display: grid; min-width: 0; }
.mu-head strong { font-size: 14px; }
.mu-head span { font-size: 12.5px; color: var(--muted); }
.mu-count { font-size: 13px; color: var(--text); }
.mu-grid { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mu-dot {
  --c: var(--amber); --s: 14px; position: relative;
  width: var(--s); height: var(--s); border-radius: 50%;
  border: 1.5px solid var(--line-strong); background: rgba(255, 255, 255, 0.02);
  transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, transform 0.35s ease;
}
.t2 .mu-dot { --c: var(--fire); --s: 22px; }
.t3 .mu-dot { --c: var(--burn); --s: 32px; }
.mu-dot.on { background: var(--c); border-color: var(--c); box-shadow: 0 0 14px -1px var(--c); transform: scale(1.04); }
.mu-dot.on::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--neuro);
  opacity: 0; animation: mu-fire 1.4s ease-out infinite; animation-delay: var(--ph, 0s);
}
@keyframes mu-fire { 0% { opacity: 0.9; transform: scale(0.75); } 70%, 100% { opacity: 0; transform: scale(1.25); } }
.live-explain { margin: 0; padding: 12px 14px; border-radius: 10px; background: rgba(57, 213, 255, 0.06); border: 1px solid rgba(57, 213, 255, 0.2); font-size: 14px; }

/* Stage 3 */
.rate-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.hz-readout { display: grid; gap: 2px; }
.fusion-tag { font-family: var(--f-mono); font-size: 12px; color: var(--amber); padding: 6px 10px; border: 1px solid rgba(255, 189, 90, 0.35); border-radius: 8px; background: rgba(255, 189, 90, 0.06); }
.scope {
  position: relative; height: clamp(270px, 40vw, 360px); border-radius: 12px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, #071225, #03060d); border: 1px solid var(--line);
  box-shadow: inset 0 0 40px rgba(57, 213, 255, 0.06);
}
.scope canvas { display: block; position: absolute; inset: 0; }
.rate-ctl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: center; }

.rate-inputs { display: grid; gap: 16px; }
.rate-out { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }

.gauge-box { display: grid; justify-items: center; gap: 2px; }
.gauge-k { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.arc-gauge { width: 100%; max-width: 160px; height: auto; display: block; }
.arc-bg { fill: none; stroke: var(--line-strong); stroke-width: 12; stroke-linecap: round; }
.arc-val { fill: none; stroke-width: 12; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(255, 138, 61, 0.7)); transition: stroke-dasharray 0.25s linear; }
.arc-tick { stroke: var(--faint); stroke-width: 1.5; }
.arc-num { font-family: var(--f-mono); font-weight: 600; font-size: 30px; fill: var(--text); }
.arc-unit { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.rfd-box { display: grid; gap: 8px; min-width: 0; }
.rfd-top { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }
.rfd-top .mono { color: var(--text); font-weight: 600; }
.meter { height: 8px; border-radius: 999px; background: var(--line-strong); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--neuro), var(--fire)); box-shadow: 0 0 12px rgba(255, 138, 61, 0.5); transition: width 0.35s ease; }
.rfd-note { margin: 0; font-size: 12.5px; color: var(--faint); }

/* Stage 4 */
.fatigue-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.fpanel { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: rgba(4, 6, 12, 0.55); border: 1px solid var(--line); min-width: 0; }
.fpanel-head { display: grid; }
.fpanel-head strong { font-size: 14.5px; }
.fpanel-head span { font-size: 12.5px; color: var(--muted); }
.fp-svg { width: 100%; height: auto; display: block; }
.fp-svg .path-base { stroke-width: 6; }
.drive { fill: none; stroke: var(--neuro); stroke-linecap: round; stroke-dasharray: 12 58; animation: flow var(--dur, 0.6s) linear infinite; filter: drop-shadow(0 0 5px var(--neuro)); transition: opacity 0.5s, stroke-width 0.5s; }
@keyframes flow { from { stroke-dashoffset: 70; } to { stroke-dashoffset: 0; } }
.svg-k { font-family: var(--f-mono); font-size: 11px; fill: var(--faint); }
.fiber-body { fill: rgba(255, 90, 60, 0.07); stroke: rgba(255, 138, 61, 0.45); stroke-width: 1.4; }
.zline { stroke: rgba(255, 138, 61, 0.18); stroke-width: 6; }
.sr { stroke: rgba(57, 213, 255, 0.25); stroke-width: 3; stroke-linecap: round; }
.metab { transition: opacity 0.6s; animation: drift 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.metab.h { fill: var(--burn); }
.metab.p { fill: var(--amber); }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -3px); } }
.fbar-row { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 10px; align-items: center; }
.fbar { height: 10px; border-radius: 999px; background: var(--line-strong); overflow: hidden; }
.fbar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--amber), var(--fire) 55%, var(--burn)); box-shadow: 0 0 14px rgba(255, 67, 87, 0.55); transition: width 0.6s cubic-bezier(0.2, 0.7, 0.2, 1); }
.fbar-v { font-size: 13px; text-align: right; color: var(--text); }
.fp-stat { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.lg.ca { background: var(--neuro-hi); }
.lg.h { background: var(--burn); }
.lg.p { background: var(--amber); }

.perf-row { display: grid; grid-template-columns: 96px minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }

.lane { position: relative; min-height: 150px; border-radius: 12px; background: rgba(4, 6, 12, 0.55); border: 1px solid var(--line); overflow: hidden; }
.lane-rail { position: absolute; left: 50%; top: 14px; bottom: 26px; width: 2px; margin-left: -1px; background: repeating-linear-gradient(var(--line-strong) 0 6px, transparent 6px 12px); }
.barbell { position: absolute; left: 8px; right: 8px; bottom: 30px; height: 22px; display: flex; align-items: center; justify-content: center; }
.barbell .bar { flex: 1; height: 4px; background: linear-gradient(90deg, #8ea2c8, #dfe7f7, #8ea2c8); border-radius: 2px; }
.barbell .plate { width: 7px; height: 22px; border-radius: 2px; background: var(--fire); box-shadow: 0 0 10px rgba(255, 138, 61, 0.6); }
.barbell .plate.s { height: 16px; width: 5px; background: var(--amber); margin: 0 1px; }
.lane-k { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-family: var(--f-mono); font-size: 10px; color: var(--faint); }
.vel-box, .rpe-box { display: grid; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(4, 6, 12, 0.55); border: 1px solid var(--line); min-width: 0; align-content: start; }
.vel-top { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.vel-top > div { display: grid; }
.vk { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.vv { font-size: 22px; font-weight: 600; line-height: 1.15; }
.vv small { font-size: 12px; color: var(--muted); font-weight: 400; }
.vel-bars { display: flex; gap: 6px; align-items: flex-end; height: 74px; }
.vbar { flex: 1; height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 4px; min-width: 0; }
.vbar > span { align-self: end; width: 100%; border-radius: 4px 4px 2px 2px; transition: height 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); box-shadow: 0 0 12px -3px rgba(255, 138, 61, 0.7); }
.vbar em { font-style: normal; font-size: 10px; color: var(--faint); text-align: center; }
.vbar:not(.on) > span { height: 0 !important; }
.vbar.void { opacity: 0.3; }
.rpe-scale { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.rpe-seg { height: 34px; border-radius: 6px; border: 1px solid var(--line-strong); display: grid; place-items: center; transition: background 0.4s, border-color 0.4s, box-shadow 0.4s; }
.rpe-seg span { font-size: 12px; color: var(--faint); }
.rpe-seg.on span { color: #0a0f1c; font-weight: 600; }
.rpe-seg.r5.on { background: #4fd7ff; border-color: #4fd7ff; }
.rpe-seg.r6.on { background: #7fdcd8; border-color: #7fdcd8; }
.rpe-seg.r7.on { background: var(--amber); border-color: var(--amber); }
.rpe-seg.r8.on { background: #ffa04a; border-color: #ffa04a; }
.rpe-seg.r9.on { background: var(--fire); border-color: var(--fire); }
.rpe-seg.r10.on { background: var(--burn); border-color: var(--burn); }
.rpe-seg.cur { box-shadow: 0 0 16px -2px var(--fire); transform: translateY(-2px); }
.rpe-legend { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); }
.history { display: flex; flex-wrap: wrap; gap: 8px; }
.hist-chip { font-size: 11.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong); }

/* Stage 5 */
.sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }

.sim-inputs { display: grid; gap: 16px; padding: 4px 2px; }
.sim-out { display: grid; gap: 12px; min-width: 0; }
.meter-card { position: relative; display: grid; justify-items: center; padding: 14px 14px 10px; border-radius: 12px; background: rgba(4, 6, 12, 0.6); border: 1px solid var(--line); transition: box-shadow 0.5s, border-color 0.5s; }
.meter-card.ok { box-shadow: inset 0 0 40px -16px rgba(62, 224, 164, 0.45); }
.meter-card.warn { box-shadow: inset 0 0 40px -16px rgba(255, 201, 74, 0.45); }
.meter-card.bad { box-shadow: inset 0 0 46px -12px rgba(255, 77, 94, 0.6); border-color: rgba(255, 77, 94, 0.45); }
.mc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.zone-pill { padding: 3px 9px; border: 1px solid; border-radius: 999px; letter-spacing: 0.06em; font-weight: 600; transition: color 0.4s, border-color 0.4s; }
.needle-gauge { width: 100%; max-width: 280px; height: auto; display: block; margin-top: 6px; }
.ng-track { fill: none; stroke: var(--line); stroke-width: 16; }
.ng-zone { fill: none; stroke-width: 14; opacity: 0.85; }
.ng-needle { transform-origin: 100px 100px; transition: transform 0.7s cubic-bezier(0.3, 1.4, 0.5, 1); }
.ng-needle line { stroke: var(--text); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5)); }
.ng-needle circle { fill: var(--text); }
.ng-lbl { font-family: var(--f-mono); font-size: 10px; fill: var(--faint); }
.score { font-size: 44px; font-weight: 600; line-height: 1; margin-top: -6px; transition: color 0.4s; text-shadow: 0 0 22px currentColor; }
.recov { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: rgba(4, 6, 12, 0.55); border: 1px solid var(--line); }
.recov-v { font-size: 26px; font-weight: 600; color: var(--text); }
.recov-v small { font-size: 13px; color: var(--muted); font-weight: 400; }
.recov-k { font-size: 12.5px; color: var(--muted); }
.recs { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255, 138, 61, 0.3); background: rgba(255, 138, 61, 0.05); }
.recs ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; }
.recs li::marker { color: var(--fire); font-family: var(--f-mono); font-weight: 600; }
.formula { border-radius: 12px; border: 1px dashed var(--line-strong); padding: 10px 14px; }
.formula summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.formula summary:focus-visible { outline: 2px solid var(--neuro-hi); outline-offset: 3px; border-radius: 4px; }
.parts { display: grid; gap: 6px; margin-top: 10px; }
.part { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.part .mono { text-align: right; color: var(--text); }
.part-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.part-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--burn)); border-radius: inherit; transition: width 0.4s; }
.formula-note { margin: 10px 0 0; font-size: 12.5px; color: var(--faint); }

/* Pager */




@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  .drive { animation: none; stroke-dasharray: none; }
  .mu-dot.on::after { display: none; }
}

/* Layout: phone app. Header (wordmark + tab title) → scrolling content → 5-slot tab bar. On wide screens the app sits in a device frame. Single dark theme by design. */
:root {
  color-scheme: dark;
  --void: #04060c;
  --deep: #070b16;
  --panel: #0a1121;
  --raised: #0f182c;
  --line: #182540;
  --line-strong: #24365a;
  --text: #e6edfb;
  --muted: #93a1c0;
  --faint: #5f6f92;
  --neuro: #39d5ff;
  --neuro-hi: #b8f1ff;
  --fire: #ff8a3d;
  --amber: #ffbd5a;
  --burn: #ff4357;
  --ok: #3ee0a4;
  --warn: #ffc94a;
  --bad: #ff4d5e;
  --c1: #e66a1c;
  --c2: #1aa0cc;
  --limb: #22324f;
  --limb-hi: #3b5687;
  --f-display: "Saira", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--void); }
body {
  margin: 0; background: var(--void); color: var(--text);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
#root { height: 100%; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.neuro { color: var(--neuro); }
.fire { color: var(--fire); }
button { font: inherit; }

/* ---------- Device ---------- */
.device-wrap {
  height: 100%; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(700px 480px at 20% 0%, rgba(57, 213, 255, 0.10), transparent 62%),
    radial-gradient(640px 420px at 90% 100%, rgba(255, 120, 60, 0.08), transparent 60%),
    var(--void);
}
.device { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--deep); }
@media (min-width: 620px) and (min-height: 660px) {
  .device {
    width: 400px; height: min(880px, calc(100% - 40px)); border-radius: 42px;
    border: 1px solid var(--line-strong);
    box-shadow: 0 0 0 8px #0b1120, 0 0 0 9px var(--line), 0 40px 90px -30px rgba(0, 0, 0, 0.9), 0 0 80px -30px rgba(57, 213, 255, 0.25);
  }
}
.app-shell { position: relative; height: 100%; display: flex; flex-direction: column; }

/* ---------- Header ---------- */
.app-head {
  flex: none; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 16px 12px;
  background: linear-gradient(180deg, var(--deep), rgba(7, 11, 22, 0.94));
  border-bottom: 1px solid var(--line);
}
.brand-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wordmark { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.22em; color: var(--muted); }
.wm-mark { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 6px; color: var(--neuro); background: rgba(57, 213, 255, 0.1); box-shadow: 0 0 12px rgba(57, 213, 255, 0.35); }
.ver { font-size: 10px; color: var(--faint); letter-spacing: 0.06em; }
.tab-title { margin: 8px 0 0; font-family: var(--f-display); font-stretch: 80%; font-weight: 720; font-size: 30px; line-height: 1; letter-spacing: -0.005em; color: var(--text); }
.tab-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

/* ---------- Main ---------- */
.app-main {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 16px 28px;
  scroll-behavior: smooth;
}
.app-main::-webkit-scrollbar { width: 0; }

/* ---------- Tab bar ---------- */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  padding-left: calc(var(--gut-l) - 10px); padding-right: calc(var(--gut-r) - 10px); padding-block: 6px 8px;
  background: rgba(5, 8, 16, 0.96); border-top: 1px solid var(--line);
}
.tab {
  appearance: none; position: relative; background: none; border: 0; cursor: pointer; color: var(--faint);
  display: grid; justify-items: center; gap: 3px; padding: 6px 0 4px; border-radius: 12px; min-width: 0;
}
.tab-ic { display: grid; place-items: center; width: 40px; height: 28px; border-radius: 10px; transition: background 0.25s, color 0.25s, box-shadow 0.25s; }
.tab-l { font-size: 10.5px; font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; }
.tab.on { color: var(--neuro-hi); }
.tab.on .tab-ic { background: rgba(57, 213, 255, 0.13); color: var(--neuro); box-shadow: 0 0 16px -4px rgba(57, 213, 255, 0.7); }
.tab.soon { color: #3d4b6a; }
.soon-dot { position: absolute; top: 7px; right: calc(50% - 18px); width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); border: 1px solid var(--faint); }
.tab:focus-visible { outline: 2px solid var(--neuro); outline-offset: -2px; }

.toast {
  position: absolute; left: 16px; right: 16px; bottom: 84px; z-index: 20;
  padding: 11px 14px; border-radius: 12px; font-size: 13px; color: var(--text);
  background: rgba(15, 24, 44, 0.97); border: 1px solid var(--line-strong); box-shadow: 0 16px 30px -12px rgba(0, 0, 0, 0.8);
  animation: toast-in 0.25s ease-out;
}
@keyframes toast-in { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }

/* ---------- Shared bits ---------- */
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neuro); }
h3 { margin: 0; font-family: var(--f-display); font-stretch: 85%; font-weight: 650; font-size: 18px; line-height: 1.15; }
.card { display: grid; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-hint { font-size: 11.5px; color: var(--faint); font-family: var(--f-mono); }

/* ---------- Hub ---------- */
.hub { display: grid; gap: 22px; }
.goal {
  position: relative; display: grid; gap: 12px; padding: 16px; border-radius: 18px; overflow: hidden;
  background: linear-gradient(150deg, rgba(255, 138, 61, 0.14), rgba(255, 138, 61, 0.02) 55%), var(--panel);
  border: 1px solid rgba(255, 138, 61, 0.35);
}
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.goal-top .eyebrow { color: var(--fire); }
.goal-lift { font-size: 12.5px; color: var(--muted); }
.goal-nums { display: flex; align-items: center; gap: 16px; color: var(--faint); }
.goal-nums > div { display: grid; }
.g-v { font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; color: var(--text); }
.g-v.hot { color: var(--fire); text-shadow: 0 0 26px rgba(255, 138, 61, 0.55); }
.g-k { font-size: 11px; color: var(--muted); font-family: var(--f-mono); letter-spacing: 0.06em; }
.goal-track { position: relative; height: 8px; border-radius: 999px; background: var(--line-strong); margin-top: 4px; }
.gt-fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, var(--amber), var(--fire)); box-shadow: 0 0 14px rgba(255, 138, 61, 0.6); }
.gt-mark { position: absolute; top: -4px; width: 2px; height: 16px; margin-left: -1px; background: var(--muted); border-radius: 2px; }
.gt-mark.target { background: var(--fire); box-shadow: 0 0 10px var(--fire); width: 3px; }
.goal-scale { position: relative; height: 30px; font-size: 9.5px; color: var(--faint); }
.goal-scale span { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; line-height: 1.3; white-space: nowrap; }
.goal-scale span.start { transform: none; justify-items: start; }
.goal-scale span.end { transform: translateX(-100%); justify-items: end; }
.goal-scale b { color: var(--text); font-size: 11px; font-weight: 600; }
.goal-note { margin: 0; font-size: 13px; color: var(--muted); }

.hub-sec { display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-k { font-size: 11.5px; color: var(--faint); }
.mods { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mod { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.mod.next { background: transparent; border-style: dashed; }
.mod-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.mod.ready .mod-ic { color: var(--neuro); background: rgba(57, 213, 255, 0.1); border-color: rgba(57, 213, 255, 0.35); box-shadow: 0 0 14px -4px rgba(57, 213, 255, 0.6); }
.mod.partial .mod-ic { color: var(--amber); }
.mod-body { display: grid; gap: 6px; min-width: 0; }
.mod-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mod-top strong { font-size: 15px; }
.mod-body p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.pill { font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid; }
.pill.ready { color: var(--neuro); border-color: rgba(57, 213, 255, 0.5); background: rgba(57, 213, 255, 0.08); }
.pill.partial { color: var(--amber); border-color: rgba(255, 189, 90, 0.45); }
.pill.next { color: var(--faint); border-color: var(--line-strong); }
.mod-links { display: flex; flex-wrap: wrap; gap: 6px; }
.mod-link {
  appearance: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--raised);
  color: var(--text); font-size: 12.5px; font-weight: 500;
}
.mod-link:hover { border-color: var(--neuro); color: var(--neuro-hi); }
.mod-link:focus-visible { outline: 2px solid var(--neuro); outline-offset: 2px; }
.mod-data { display: flex; flex-wrap: wrap; gap: 6px; }
.mod-data span { font-size: 10.5px; color: var(--faint); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }

.flow-card { padding: 12px 10px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 6px; }
.flow { width: 100%; height: auto; display: block; }
.fl-node rect { fill: var(--deep); stroke: var(--line-strong); stroke-width: 1.2; stroke-dasharray: 4 3; }
.fl-node.ready rect { stroke: rgba(57, 213, 255, 0.6); stroke-dasharray: none; fill: rgba(57, 213, 255, 0.06); }
.fl-dot { fill: none; stroke: var(--faint); stroke-width: 1.5; }
.fl-node.ready .fl-dot { fill: var(--neuro); stroke: var(--neuro); }
.fl-t { font-family: var(--f-body); font-size: 12.5px; font-weight: 600; fill: var(--text); }
.fl-s { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); }
.fl-edge { fill: none; stroke: rgba(57, 213, 255, 0.55); stroke-width: 1.4; stroke-dasharray: 5 4; }
.fl-edge.two { stroke: var(--faint); }
.fl-head { fill: rgba(57, 213, 255, 0.8); }
.fl-lbl { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.flow-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); padding-left: 6px; }
.flow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.fl-key { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); }
.fl-key.ready { background: var(--neuro); border-color: var(--neuro); }
.flow-note { margin: 0; font-size: 12.5px; color: var(--muted); }
.palette-row { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); }
.palette-row span { display: inline-flex; align-items: center; gap: 7px; }
.palette-row i { width: 14px; height: 6px; border-radius: 3px; box-shadow: 0 0 10px currentColor; }

/* ---------- Biomech ---------- */
.bio { display: grid; gap: 14px; }
.bio-intro p { margin: 0; font-size: 13.5px; color: var(--muted); }
.bio-intro strong { color: var(--text); font-weight: 600; }
.move-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.move {
  appearance: none; cursor: pointer; text-align: left; display: grid; gap: 2px; padding: 9px 10px; min-width: 0;
  border-radius: 12px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted);
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.move-n { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
.move-t { font-size: 10px; font-family: var(--f-mono); color: var(--faint); line-height: 1.3; }
.move.on { border-color: var(--fire); background: linear-gradient(160deg, rgba(255, 138, 61, 0.16), rgba(255, 138, 61, 0.03)); box-shadow: 0 0 18px -6px rgba(255, 138, 61, 0.7); }
.move.on .move-t { color: var(--amber); }
.move:focus-visible { outline: 2px solid var(--neuro); outline-offset: 2px; }
.move-more { margin: -4px 0 0; font-size: 11.5px; color: var(--faint); }
.bio-panel { display: grid; gap: 14px; }

.fig-card { display: grid; gap: 10px; padding: 12px; border-radius: 16px; border: 1px solid var(--line);
  background:
    linear-gradient(rgba(57, 213, 255, 0.035) 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(90deg, rgba(57, 213, 255, 0.035) 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(180deg, var(--panel), var(--deep));
}
.fig-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.fig-title { font-size: 12.5px; color: var(--muted); }
.fig-meta { font-size: 11px; color: var(--faint); }
.fig { aspect-ratio: 1 / 0.92; max-width: 100%; border-radius: 12px; background: rgba(3, 5, 11, 0.6); border: 1px solid var(--line); overflow: hidden; }
.bio-svg { display: block; width: 100%; height: 100%; }
.fig-note { margin: 0; font-size: 12px; color: var(--faint); }

.floor { stroke: var(--line-strong); stroke-width: 1; }
.bench-pad { stroke: #2b2f3c; stroke-linecap: round; }
.bench-leg { stroke: #1a2236; stroke-linecap: round; }
.bench-rect { fill: #2b2f3c; }
.limb { stroke: var(--limb); stroke-linecap: round; }
.limb.far { stroke: #172238; }
.limb.arm { stroke: var(--limb-hi); }
.torso { stroke: var(--limb); stroke-linecap: round; }
.torso-el { fill: var(--limb); stroke: var(--limb-hi); stroke-width: 0.8; }
.head { fill: var(--limb); stroke: var(--limb-hi); stroke-width: 0.8; }
.joint { fill: var(--deep); stroke: var(--neuro); stroke-width: 1.3; }
.com { fill: var(--deep); stroke: var(--muted); stroke-width: 1; }
.heat { fill: var(--fire); }
.plate { fill: rgba(255, 189, 90, 0.07); stroke: rgba(255, 189, 90, 0.6); stroke-width: 1; }
.plate-hub { fill: var(--amber); }
.plate-rect { fill: rgba(255, 189, 90, 0.18); stroke: rgba(255, 189, 90, 0.7); stroke-width: 0.8; }
.barbell-line { stroke: #c9d4ea; stroke-width: 1.6; }
.bar-path { fill: none; stroke: rgba(57, 213, 255, 0.35); stroke-width: 0.8; stroke-dasharray: 1.5 2; }
.bar-path.stick { stroke: var(--fire); stroke-width: 1.6; stroke-dasharray: none; opacity: 0.8; }
.force-line { stroke: rgba(255, 255, 255, 0.45); stroke-dasharray: 2.5 2.5; }
.force-line.body { stroke: rgba(147, 161, 192, 0.5); }
.farrow line, .farrow path { stroke: var(--amber); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.marm-line { stroke: var(--neuro); }
.marm.e .marm-line { stroke: var(--neuro-hi); }
.arm-label rect { fill: rgba(4, 8, 18, 0.9); stroke: rgba(57, 213, 255, 0.6); stroke-width: 0.6; }
.arm-label text { font-family: var(--f-mono); font-weight: 600; fill: var(--neuro-hi); }
.svg-cap { font-family: var(--f-mono); font-size: 5.6px; letter-spacing: 0.08em; fill: var(--faint); }
.hamstring { fill: none; stroke: var(--burn); stroke-linecap: round; }
.midfoot { fill: var(--neuro); }
.band { stroke: var(--amber); stroke-linecap: round; filter: drop-shadow(0 0 2px rgba(255, 189, 90, 0.6)); }
.cable { stroke: #c9d4ea; }
.pulley { fill: var(--deep); stroke: #c9d4ea; stroke-width: 1.2; }
.db-bar { stroke: #c9d4ea; stroke-linecap: round; }
.db-plate { stroke: var(--amber); stroke-linecap: round; }

.transport { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
.icon-btn {
  appearance: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--neuro); background: rgba(57, 213, 255, 0.12); color: var(--neuro-hi); box-shadow: 0 0 16px -4px rgba(57, 213, 255, 0.6);
}
.icon-btn:focus-visible { outline: 2px solid var(--neuro-hi); outline-offset: 2px; }
.tr-slider { display: grid; gap: 0; min-width: 0; }
.tr-label { font-size: 11.5px; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { display: grid; gap: 1px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); min-width: 0; transition: border-color 0.3s, box-shadow 0.3s; }
.tile-k { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.tile-v { font-size: 24px; font-weight: 600; line-height: 1.15; color: var(--text); }
.tile-v small { font-size: 12px; color: var(--muted); font-weight: 400; }
.tile-sub { font-size: 11.5px; color: var(--muted); }
.tile.hot { border-color: rgba(255, 138, 61, 0.55); box-shadow: inset 0 0 24px -12px rgba(255, 138, 61, 0.7); }

/* chart */
.chart { display: grid; gap: 6px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.lg-item i { width: 14px; height: 4px; border-radius: 2px; border: 1px solid; }
.lg-item i.dash { height: 0; border-width: 0; border-top: 2px dashed; }
.lg-item b { font-weight: 600; color: var(--text); font-size: 12px; }
.lg-item.muted b { color: var(--muted); }
.chart-svg { width: 100%; height: auto; display: block; touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
.grid { stroke: rgba(147, 161, 192, 0.12); stroke-width: 1; }
.tick { font-family: var(--f-mono); font-size: 9.5px; fill: var(--faint); }
.axis-t { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.line.dash { stroke-dasharray: 5 4; stroke-width: 1.5; }
.area { opacity: 0.16; }
.stack-gap { fill: none; stroke: var(--panel); stroke-width: 2; }
.direct { font-family: var(--f-body); font-size: 10.5px; font-weight: 600; fill: var(--text); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.direct.muted { fill: var(--muted); font-weight: 500; }
.cursor { stroke: var(--neuro-hi); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.8; }
.cursor-dot { fill: var(--panel); stroke-width: 2; }
.chart-band { fill: rgba(255, 67, 87, 0.08); }
.chart-band-t { font-family: var(--f-mono); font-size: 9px; fill: rgba(255, 140, 150, 0.85); }
.hit { fill: transparent; }
.chart-note { margin: 0; font-size: 12px; color: var(--faint); }
.data-table summary { cursor: pointer; font-size: 12px; color: var(--faint); }
.data-table summary:focus-visible { outline: 2px solid var(--neuro); outline-offset: 2px; border-radius: 4px; }
.tbl-wrap { overflow-x: auto; margin-top: 8px; }
.data-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th { text-align: right; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table td { text-align: right; padding: 4px 6px; color: var(--text); border-bottom: 1px solid rgba(24, 37, 64, 0.6); }
.data-table th:first-child, .data-table td:first-child { text-align: left; }

/* controls */
.controls { display: grid; gap: 16px; }
.seg-label { font-size: 13.5px; color: var(--muted); }
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 3px; border-radius: 11px; background: var(--deep); border: 1px solid var(--line); }
.segmented button {
  appearance: none; border: 0; cursor: pointer; padding: 8px 6px; border-radius: 8px; background: transparent;
  color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.segmented button.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong), 0 0 12px -4px rgba(57, 213, 255, 0.5); }
.segmented button:focus-visible { outline: 2px solid var(--neuro); outline-offset: -2px; }
.segmented.sm { display: inline-grid; }
.segmented.sm button { padding: 6px 10px; font-size: 12px; }

.emph { display: grid; gap: 10px; }
.emph-row { display: grid; grid-template-columns: 118px minmax(0, 1fr) 40px; gap: 10px; align-items: center; }
.emph-k { display: grid; line-height: 1.25; }
.emph-k span { font-size: 13px; }
.emph-k small { font-size: 10.5px; color: var(--faint); }
.emph-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.emph-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--amber), var(--fire)); box-shadow: 0 0 12px rgba(255, 138, 61, 0.5); transition: width 0.4s ease; }
.goal-tag { font-family: var(--f-mono); font-size: 9.5px; color: var(--fire); border: 1px solid rgba(255, 138, 61, 0.45); border-radius: 999px; padding: 1px 6px; text-align: center; }
.goal-tag.ghost { border: 0; }

/* ---------- Fatigue tab (CNS module) ---------- */
.fatigue { display: grid; gap: 14px; }
.sub-nav {
  position: sticky; top: 0; z-index: 4; margin-top: -16px; padding-top: 12px;
  margin-left: calc(-1 * var(--gut-l)); margin-right: calc(-1 * var(--gut-r));
  padding-left: var(--gut-l); padding-right: var(--gut-r);
  background: linear-gradient(180deg, var(--deep) 82%, rgba(7, 11, 22, 0));
}
.sub-nav .axon { margin-block: 0 4px; }
.stage-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.lab { padding: 14px; }
h2 { font-size: 25px; }
.lede { font-size: 14px; }
.big-num { font-size: 40px; }
.node-label { font-size: 10.5px; letter-spacing: 0; }
.node-dot { width: 26px; height: 26px; }
.btn { padding: 10px 13px; font-size: 13.5px; }
.set-info { margin-left: 0; width: 100%; }
.recruit-top { gap: 12px 28px; }
.rate-ctl { grid-template-columns: minmax(0, 1fr); }
.rate-out { grid-template-columns: 132px minmax(0, 1fr); }
.scope { height: 280px; }
.fatigue-panels { gap: 8px; }
.fpanel { padding: 10px; gap: 8px; }
.fpanel-head strong { font-size: 13.5px; }
.fpanel-head span { font-size: 11.5px; }
.fp-stat, .legend { font-size: 11.5px; }
.perf-row { grid-template-columns: 76px minmax(0, 1fr); }
.rpe-box { grid-column: 1 / -1; }
.sim-grid { grid-template-columns: minmax(0, 1fr); }
.diagram svg { min-width: 0; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.pager-mid { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.pager-mid .mono { color: var(--neuro); }

@media (prefers-reduced-motion: reduce) {
  .app-main { scroll-behavior: auto; }
  .toast { animation: none; }
}

/* ---------- Günlük ---------- */
.btn.sm { padding: 7px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.full { width: 100%; justify-content: center; }
.btn.big { padding: 15px 16px; font-size: 15.5px; }
.btn.danger { background: rgba(255, 77, 94, 0.14); border-color: var(--bad); color: #ffd0d5; }
.btn.danger-t { color: #ff9aa4; border-color: transparent; background: transparent; }
.btn.danger-t:hover:not(:disabled) { border-color: rgba(255, 77, 94, 0.5); }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 11px; }
.icon-btn:disabled { opacity: 0.35; box-shadow: none; cursor: not-allowed; }
.eyebrow.fire { color: var(--fire); }
.muted-p { margin: 0; font-size: 13px; color: var(--faint); }

.log, .editor, .session, .summary { display: grid; gap: 16px; }
.log-sec { display: grid; gap: 10px; }

.sync { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-size: 11.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.sync.wait i { background: var(--faint); box-shadow: none; animation: blink 1.2s ease-in-out infinite; }
.sync.warn { color: var(--amber); border-color: rgba(255, 189, 90, 0.35); }
.sync.warn i { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.sync.bad { color: #ffb3ba; border-color: rgba(255, 77, 94, 0.45); }
.sync.bad i { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
@keyframes blink { 50% { opacity: 0.3; } }

/* week strip */
.week { display: grid; gap: 8px; }
.week-h { display: flex; justify-content: space-between; align-items: baseline; }
.week-k { font-size: 11.5px; color: var(--muted); }
.week-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wd { display: grid; justify-items: center; gap: 2px; padding: 7px 0 8px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); }
.wd-k { font-size: 10px; color: var(--faint); letter-spacing: 0.04em; }
.wd-d { font-size: 14px; color: var(--muted); font-weight: 600; }
.wd-dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 2px; }
.wd.plan .wd-dot { border: 1.5px solid var(--neuro); }
.wd.missed .wd-dot { border: 1.5px solid var(--faint); }
.wd.done { border-color: rgba(255, 138, 61, 0.55); background: linear-gradient(180deg, rgba(255, 138, 61, 0.14), rgba(255, 138, 61, 0.03)); }
.wd.done .wd-d { color: var(--text); }
.wd.done .wd-dot { background: var(--fire); box-shadow: 0 0 8px var(--fire); }
.wd.today { border-color: var(--neuro); box-shadow: 0 0 14px -5px rgba(57, 213, 255, 0.8); }
.wd.today .wd-k { color: var(--neuro); }

/* hero card */
.hero-card { display: grid; gap: 8px; padding: 14px; border-radius: 16px; background: linear-gradient(150deg, rgba(57, 213, 255, 0.12), rgba(57, 213, 255, 0.02) 60%), var(--panel); border: 1px solid rgba(57, 213, 255, 0.4); }
.hero-card.live { background: linear-gradient(150deg, rgba(255, 138, 61, 0.16), rgba(255, 138, 61, 0.02) 60%), var(--panel); border-color: rgba(255, 138, 61, 0.5); }
.hc-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.hc-top .live-dot + .eyebrow { margin-right: auto; }
.hc-when { font-size: 11.5px; color: var(--neuro-hi); }
.hero-card h3 { font-size: 21px; }
.hc-sub { margin: 0; font-size: 12.5px; color: var(--muted); }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fire); box-shadow: 0 0 10px var(--fire); animation: blink 1.4s ease-in-out infinite; }

/* program cards */
.prog { display: grid; gap: 6px; padding: 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.prog-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.prog-t { display: grid; min-width: 0; }
.prog-t strong { font-size: 15.5px; }
.prog-t span { font-size: 11px; color: var(--faint); }
.prog-days { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pday { display: grid; grid-template-columns: 38px minmax(0, 1fr) 36px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid rgba(24, 37, 64, 0.7); }
.pday-wd { display: grid; place-items: center; height: 26px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--neuro); background: rgba(57, 213, 255, 0.08); border: 1px solid rgba(57, 213, 255, 0.3); }
.pday-wd.none { color: var(--faint); background: transparent; border-color: var(--line); }
.pday-t { display: grid; min-width: 0; }
.pday-t span { font-size: 14px; font-weight: 500; }
.pday-t small { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.new-prog { display: flex; flex-wrap: wrap; gap: 8px; }
.tmpls { display: grid; gap: 8px; }
.tmpl { appearance: none; text-align: left; cursor: pointer; display: grid; gap: 2px; padding: 12px; border-radius: 12px; background: var(--raised); border: 1px dashed var(--line-strong); color: var(--text); }
.tmpl:hover { border-color: var(--neuro); }
.tmpl strong { font-size: 14px; }
.tmpl span { font-size: 12.5px; color: var(--muted); }
.tmpl small { font-size: 10.5px; color: var(--neuro); }
.empty { display: grid; gap: 6px; padding: 16px; border-radius: 14px; border: 1px dashed var(--line-strong); background: rgba(10, 17, 33, 0.5); justify-items: start; }
.empty strong { font-size: 15px; }
.empty p { margin: 0; font-size: 13px; color: var(--muted); }
.empty.sm { padding: 12px 14px; }
.skeleton { display: grid; gap: 8px; }
.skeleton span { height: 52px; border-radius: 12px; background: linear-gradient(90deg, var(--panel), var(--raised), var(--panel)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hist-row { appearance: none; width: 100%; cursor: pointer; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "d i" "n i" "k i"; column-gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.hist-row:hover { border-color: var(--line-strong); }
.hist-d { grid-area: d; font-size: 10.5px; color: var(--faint); }
.hist-n { grid-area: n; font-size: 14px; color: var(--text); font-weight: 500; }
.hist-k { grid-area: k; font-size: 11px; }
.hist-row svg { grid-area: i; align-self: center; }

/* editor */
.ed-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.back-btn { appearance: none; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; color: var(--neuro); font-size: 13.5px; padding: 6px 4px 6px 0; }
.back-btn:focus-visible { outline: 2px solid var(--neuro); outline-offset: 2px; border-radius: 6px; }
.save-st { font-size: 11px; color: var(--amber); }
.save-st.ok { color: var(--faint); }
.prog-name { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line-strong); color: var(--text); font-family: var(--f-display); font-stretch: 82%; font-weight: 700; font-size: 26px; padding: 4px 0 8px; outline: none; }
.prog-name:focus { border-bottom-color: var(--neuro); }
.prog-name::placeholder { color: var(--faint); }
.day-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { appearance: none; flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted); font-size: 13px; }
.day-tab .mono { font-size: 10.5px; color: var(--faint); }
.day-tab.on { color: var(--text); border-color: var(--neuro); background: rgba(57, 213, 255, 0.1); box-shadow: 0 0 14px -6px rgba(57, 213, 255, 0.8); }
.day-tab.on .mono { color: var(--neuro); }
.day-tab.add { border-style: dashed; color: var(--neuro); }
.day-card { display: grid; gap: 12px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.day-head { display: grid; gap: 2px; }
.day-name { width: 100%; background: transparent; border: 0; color: var(--text); font-size: 18px; font-weight: 600; padding: 2px 0; outline: none; border-bottom: 1px dashed transparent; }
.day-name:focus { border-bottom-color: var(--neuro); }
.day-k { font-size: 11px; color: var(--faint); }
.wd-pick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd-btn { appearance: none; cursor: pointer; padding: 7px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--deep); color: var(--faint); font-size: 11.5px; }
.wd-btn.on { color: var(--deep); background: var(--neuro); border-color: var(--neuro); font-weight: 600; box-shadow: 0 0 12px -3px var(--neuro); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.item { border-radius: 12px; background: var(--deep); border: 1px solid var(--line); overflow: hidden; }
.item.open { border-color: rgba(57, 213, 255, 0.45); }
.item-row { appearance: none; width: 100%; cursor: pointer; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr) 16px; gap: 10px; align-items: center; padding: 10px 12px; background: none; border: 0; color: var(--muted); }
.item-i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); font-size: 11px; color: var(--muted); }
.item-t { display: grid; gap: 1px; min-width: 0; }
.item-t strong { font-size: 14px; color: var(--text); font-weight: 600; }
.item-t small { font-size: 11px; color: var(--muted); }
.item-t em { font-style: normal; font-size: 11px; color: var(--amber); }
.item-ed { display: grid; gap: 12px; padding: 4px 12px 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.ied-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stepper { display: grid; gap: 4px; min-width: 0; }
.st-k { font-size: 11px; color: var(--muted); font-family: var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.st-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 4px; align-items: center; }
.st-btn { appearance: none; height: 38px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--text); font-size: 18px; cursor: pointer; }
.st-btn:active { background: rgba(57, 213, 255, 0.15); }
.st-in { width: 100%; height: 38px; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--deep); color: var(--text); font-size: 17px; font-weight: 600; outline: none; }
.st-in:focus, .mini-in:focus, .text-in:focus, .search:focus { border-color: var(--neuro); box-shadow: 0 0 0 3px rgba(57, 213, 255, 0.15); }
